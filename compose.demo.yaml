# Explicit sample-only initialization. Never combine with an existing production volume.
services:
  llm-mock:
    environment:
      ENVIRONMENT: development
  postgres:
    # The migration service owns the canonical ordered migration ledger.
  demo-seed:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./persob/scripts/seed.sql:/seed.sql:ro
      - ./docker/demo-source.sql:/demo-source.sql:ro
    entrypoint: [sh, -c]
    command:
      - >-
        psql -h postgres -U perso -d perso_db -v ON_ERROR_STOP=1 -f /seed.sql &&
        psql -h postgres -U perso -d perso_db -v ON_ERROR_STOP=1 -f /demo-source.sql
  telegram-gateway:
    environment:
      TELEGRAM_MOCK_MODE: "true"
      ENVIRONMENT: development
  backend-api:
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment:
      LLM_ENABLED: "true"
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: http://llm-mock:8091/v1
      LLM_MODEL: perso-healthcare-mock
      LLM_API_KEY: ${LLM_MOCK_TOKEN:-}
  message-worker:
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    environment:
      LLM_ENABLED: "true"
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: http://llm-mock:8091/v1
      LLM_MODEL: perso-healthcare-mock
      LLM_API_KEY: ${LLM_MOCK_TOKEN:-}
